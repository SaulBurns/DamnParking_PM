name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

permissions:
  contents: read

jobs:
  smoke:
    name: Static site smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify vercel.json is static (no Preact)
        run: |
          test -f vercel.json
          ! grep -qi preact vercel.json
          grep -q '"framework": null' vercel.json
          grep -q '"buildCommand": null' vercel.json
          grep -q '"outputDirectory": "."' vercel.json

      - name: Run portal smoke tests
        run: python3 scripts/smoke_test.py

      - name: npm test wrapper
        run: npm test
